apiVersion: apps/v1
kind: Deployment
metadata:
  name: pharma-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pharma-api
  template:
    metadata:
      labels:
        app: pharma-api
    spec:
      containers:
        - name: pharma-api
          image: host.docker.internal:5001/pharma-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: pharma-api-config
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pharma-api-secrets
                  key: HF_TOKEN
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
